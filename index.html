<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>KEIRIN FLOW - AIが展開を読む競輪シミュレーター</title>
    <meta name="description" content="AIが展開を読む競輪シミュレーター。誘導切り・突っ張り・捲り・番手ブロックまで、各選手が自分で判断して走ります。">

    <!-- ホーム画面に追加 (PWA) -->
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KEIRIN FLOW">

    <!-- LINE / SNS で共有したときのカード表示 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="KEIRIN FLOW">
    <meta property="og:title" content="KEIRIN FLOW - AIが展開を読む競輪シミュレーター">
    <meta property="og:description" content="並びを変えて「もしも」の展開を試せる。各選手が自分で判断して走る競輪デジタルツイン。">
    <meta property="og:url" content="https://shigemarukun.github.io/keirin-flow/">
    <meta property="og:image" content="https://shigemarukun.github.io/keirin-flow/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="ja_JP">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="app">
        <header>
            <p class="eyebrow">KEIRIN DIGITAL TWIN</p>
            <h1>KEIRIN FLOW</h1>
            <p class="subtitle">Where Every Race Has a Thousand Futures.</p>
        </header>

        <main>
            <section id="bank-container" aria-label="競輪シミュレーション">
                <canvas id="bankCanvas" width="800" height="800"></canvas>
                <div id="race-info-overlay">
                    <span id="lap-counter">残り2周 / 残り800m</span>
                    <span id="race-status">PRE-RACE</span>
                    <span id="gap-status">車間: --</span>
                    <span id="protocol-status">AI: 各選手が自律判断</span>
                </div>
                <div id="rider-legend" aria-label="選手の縁の色">
                    <span><i style="background:#38bdf8"></i>仕掛け</span>
                    <span><i style="background:#f97316"></i>踏み合い</span>
                    <span><i style="background:#ef4444"></i>ブロック</span>
                    <span><i style="background:#64748b"></i>脚切れ</span>
                </div>
            </section>

            <aside id="control-panel">
                <details class="panel-section race-input-panel">
                    <summary><h2>出走表を入力</h2><span class="ri-summary-hint">タップして開く</span></summary>
                    <div id="race-input-ui"></div>
                </details>

                <section class="panel-section tenkai-panel forecast-panel">
                    <h2>AIの展開予想</h2>
                    <div id="forecast-ui"></div>
                </section>

                <section class="panel-section tactics-panel">
                    <h2>展開を選ぶ</h2>
                    <p class="ri-help">タップすると、その展開でレースを組み直します。</p>
                    <div id="tactics-ui"></div>
                    <button id="btn-run-tactics" class="primary-btn" type="button">▶ この展開で走らせる</button>
                    <button id="btn-share" class="secondary-btn" type="button">この予想をリンクで送る</button>
                    <p id="share-note" class="ri-help" role="status"></p>
                </section>

                <section class="panel-section">
                    <h2>ライン構成</h2>
                    <div id="line-list-ui"></div>
                </section>

                <section class="panel-section decision-panel">
                    <h2>Decision Log</h2>
                    <div id="decision-log-ui" class="decision-log">
                        <p class="empty-result">START後にAI判断を表示</p>
                    </div>
                </section>

                <section class="panel-section action-buttons">
                    <h2>レース操作</h2>
                    <button id="btn-start" class="primary-btn" type="button">▶ START</button>
                    <button id="btn-pause" class="secondary-btn" type="button">⏸ PAUSE</button>
                    <button id="btn-reset" class="secondary-btn" type="button">↺ RESET</button>
                    <label class="speed-control" for="speedRange">
                        <span>速度 <strong id="speedVal">1.0</strong>x</span>
                        <input type="range" id="speedRange" min="0.5" max="3" step="0.5" value="1">
                    </label>
                </section>

                <section class="panel-section">
                    <h2>着順</h2>
                    <ol id="result-list" class="result-list">
                        <li class="empty-result">レース終了後に表示</li>
                    </ol>
                </section>

                <details class="panel-section results-panel">
                    <summary><h2>答え合わせ</h2><span class="ri-summary-hint">実際の結果を入れる</span></summary>
                    <div id="results-ui"></div>
                </details>
            </aside>
        </main>
    </div>

    <!-- スマホ: 画面の下にいつも出ている操作ボタン -->
    <nav id="mobile-bar" aria-label="レース操作">
        <button type="button" data-act="start" aria-label="スタート">▶</button>
        <button type="button" data-act="pause" aria-label="一時停止">⏸</button>
        <button type="button" data-act="reset" aria-label="最初から">↺</button>
        <button type="button" data-act="speed" class="mb-speed" aria-label="再生速度">1x</button>
        <span class="mb-status" id="mobile-bar-status">PRE-RACE</span>
    </nav>

    <script type="module" src="./main.js"></script>
    <script>
        // オフラインでも開けるようにする (対応ブラウザのみ)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
        }
    </script>
</body>
</html>
